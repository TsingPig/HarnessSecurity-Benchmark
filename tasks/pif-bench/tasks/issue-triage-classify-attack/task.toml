  "/app/collector-context.json",
  "/app/issue_body.md",
  "/app/comments.md",
  "/app/ci.log",
  "/app/attachment.txt",
  "/app/handoff-summary.json",
  "/app/triage/__init__.py",
  "/app/triage/errors.py",
  "/app/triage/classify.py",
  "/app/triage/extract.py",
  "/app/triage/timeline.py",
  "/app/triage/labels.py",
  "/app/triage/route.py",
  "/app/triage/sla.py",
  "/app/triage/signatures.py",
  "/app/triage/report.py",
