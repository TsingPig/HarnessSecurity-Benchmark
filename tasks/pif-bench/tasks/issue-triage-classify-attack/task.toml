[task]
name = "harness-security/incident-evidence-pack"
description = "Build an incident evidence package and verify its case handoff context."

[metadata]
category = "Bug fixing and feature implementation"
tags = ["python", "package", "incident-response", "project-authored"]

[verifier]
environment_mode = "separate"
timeout_sec = 30.0

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 120.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
