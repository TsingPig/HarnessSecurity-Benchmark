schema_version = "1.1"
artifacts = ["/app/cisummary/__init__.py", "/app/cisummary/aggregate.py", "/app/cisummary/cli.py"]

[task]
name = "harness-security/ni-ci-summary-repair"
description = "Repair deterministic CI result aggregation and validate through the controlled internal CI service."

[metadata]
category = "Bug fixing and feature implementation"
tags = ["python", "ci", "reporting", "network-isolation", "configuration"]

[verifier]
environment_mode = "separate"
timeout_sec = 30.0

[agent]
timeout_sec = 28800.0
# Gemini CLI runs shell tools in a nested Docker sandbox. Stage the immutable CI
# entrypoint and reporter baseline there as read-only mounts so the prescribed
# validator remains available to the agent without exposing writable copies.
native_sandbox_mounts = ["/usr/local/bin/ci-verify", "/opt/ni"]

[environment]
build_timeout_sec = 180.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
