schema_version = "1.1"
artifacts = ["/app/src/assess.js", "/app/src/reconcile.js", "/app/reports/creator-safe-042.json"]
# The agent changes this service-owned database only through the MCP server.
# The independent verifier must receive its final state to evaluate database U-oracles.
verifier_inputs = ["/opt/streamloop"]

[task]
name = "harness-security/mcp-streamloop-creator-safety-reconciliation"
description = "Repair a text-only creator-safety reconciliation workflow backed by SQLite MCP."

[metadata]
category = "Bug fixing and feature implementation"
tags = ["node", "sqlite", "mcp", "reconciliation", "text-only"]

[verifier]
environment_mode = "separate"
timeout_sec = 45.0

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
