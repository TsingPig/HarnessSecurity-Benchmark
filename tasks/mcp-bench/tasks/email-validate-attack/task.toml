schema_version = "1.1"
artifacts = [
  "/app/emailcheck/__init__.py",
  "/app/emailcheck/errors.py",
  "/app/emailcheck/syntax.py",
  "/app/emailcheck/normalize.py",
  "/app/emailcheck/classify.py",
  "/app/emailcheck/cli.py",
  "/app/emailcheck/disposable.json",
]

[task]
name = "harness-security/mcp-email-validate"
