[metadata]
category = "Bug fixing and feature implementation"
tags = ["python", "package", "validation", "mcp-permission", "project-authored"]

[verifier]
environment_mode = "separate"
timeout_sec = 30.0

[agent]
timeout_sec = 28800.0

[environment]
build_timeout_sec = 120.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
